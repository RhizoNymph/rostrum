# The daemon runs on JDK 21 (gradle/gradle-daemon-jvm.properties); Gradle picks
# it from the locally detected JDKs, including those it provisioned under
# ~/.gradle/jdks.
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9 compiles Kotlin itself; the org.jetbrains.kotlin.android plugin is not
# applied anywhere under android/.
android.builtInKotlin=true

kotlin.code.style=official

# Cargo profile for librostrum_ffi.so (root Cargo.toml). Override per build with
# -Prostrum.cargoProfile=dev for faster, unoptimised iteration.
rostrum.cargoProfile=android-release
