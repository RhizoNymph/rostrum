[package]
name = "rostrum-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "UniFFI surface the Android app calls into (placeholder)."

[lib]
name = "rostrum_ffi"
# `cdylib` is the `librostrum_ffi.so` packaged into the APK; `lib` lets the
# `uniffi-bindgen` binary below (and tests) link the crate normally.
crate-type = ["cdylib", "lib"]

# Generates the Kotlin bindings from the built `.so` (library mode). Runs on the
# build host only; see `src/bin/uniffi-bindgen.rs`.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
uniffi.workspace = true

# `cli` (uniffi_bindgen, clap, goblin, askama, ...) is only needed by the
# host-side `uniffi-bindgen` binary. Enabling it per target keeps it out of the
# Android build: resolver 2 does not unify features across targets.
[target.'cfg(not(target_os = "android"))'.dependencies]
uniffi = { workspace = true, features = ["cli"] }
