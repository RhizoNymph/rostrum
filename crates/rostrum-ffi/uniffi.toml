# Read by uniffi-bindgen (library mode finds it next to this crate's manifest).
[bindings.kotlin]
# Keep the default package (`uniffi.rostrum_ffi`): the app's R8 rules keep
# `uniffi.**`, and the app imports from it.
# `android = true` makes generated objects use Android's SystemCleaner on
# API 34+ (JNA's cleaner below that) instead of probing for
# `java.lang.ref.Cleaner`, which Android lacks before API 33.
android = true
