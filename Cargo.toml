[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# --- Local crates -----------------------------------------------------------
rostrum-config = { path = "crates/rostrum-config" }
rostrum-core = { path = "crates/rostrum-core" }
rostrum-db = { path = "crates/rostrum-db" }
rostrum-diff = { path = "crates/rostrum-diff" }
rostrum-ffi = { path = "crates/rostrum-ffi" }
rostrum-git = { path = "crates/rostrum-git" }
rostrum-handoff = { path = "crates/rostrum-handoff" }
rostrum-local = { path = "crates/rostrum-local" }
rostrum-github = { path = "crates/rostrum-github" }
rostrum-md = { path = "crates/rostrum-md" }
rostrum-remote = { path = "crates/rostrum-remote" }
rostrum-ui = { path = "crates/rostrum-ui" }

# --- GPUI -------------------------------------------------------------------
# All three come from the SAME git rev. Do NOT mix sources: `gpui` is on
# crates.io as 0.2.2, but `gpui_platform` is unpublished and declares `gpui` as
# a bare path dep with no version, so a git dep on it resolves gpui from the git
# checkout. Declaring gpui from crates.io alongside it compiles two incompatible
# copies of gpui.
#
# The first build clones Zed's history (~500 MB) into cargo's shared git cache;
# afterwards it is only refetched when the rev below moves. To iterate against a
# local Zed checkout, swap all three for `path` deps pointing at its
# `crates/gpui`, `crates/gpui_platform`, and `crates/gpui_tokio` — all three, or
# two copies of gpui end up in the graph.
gpui = { git = "https://github.com/zed-industries/zed", rev = "5e03f2d387e629237c10a4e4fed881b64abd8fea", default-features = false, features = [
    "wayland",
] }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "5e03f2d387e629237c10a4e4fed881b64abd8fea", default-features = false, features = [
    "wayland",
] }
gpui_tokio = { git = "https://github.com/zed-industries/zed", rev = "5e03f2d387e629237c10a4e4fed881b64abd8fea" }

# --- Third party ------------------------------------------------------------
anyhow = "1.0.100"
# rostrumd's servers. `default-features = false` keeps axum to what is used:
# HTTP/1, JSON bodies and the Tokio listener.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
# `-no-provider`: the workspace `rustls` is ring-only, and the server config is
# built with the ring provider explicitly rather than a process default.
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
chrono = { version = "0.4.42", features = ["serde"] }
dirs = "6.0.0"
futures = "0.3.31"
# OS randomness for identifiers (device tokens, profile ids). Pure Rust over the
# platform call, no C.
getrandom = "0.4.3"
# Interface enumeration for the addresses a pairing link advertises.
if-addrs = "0.15.0"
pulldown-cmark = { version = "0.13.0", default-features = false }
# SVG only: the pairing page renders its QR code server-side as inline SVG.
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# Pure-Rust regex engine (`regex-fancy`) avoids the `onig` C dependency.
syntect = { version = "5.2.0", default-features = false, features = [
    "default-syntaxes",
    "default-themes",
    "parsing",
    "regex-fancy",
] }
reqwest = { version = "0.12.24", default-features = false, features = [
    "json",
    "gzip",
    "rustls-tls",
] }
notify-rust = "4.11.7"
# `ring`, not the default `aws-lc-rs`: it cross-compiles to Android with nothing
# but the NDK's clang, where aws-lc-rs needs cmake and a C toolchain setup.
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sha2 = "0.11.0"
# IPV6_V6ONLY on the `::` listener, so it and `0.0.0.0` can share a port.
socket2 = "0.6.5"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
url = "2.5.8"
serde = { version = "1.0.228", features = ["derive"] }
sqlx = { version = "0.8.6", default-features = false, features = [
    "sqlite",
    "runtime-tokio",
    "tls-rustls",
    "chrono",
    "migrate",
] }
serde_json = "1.0.145"
thiserror = "2.0.17"
# `time` is declared because `tokio::time::timeout` is used directly (every
# subprocess in rostrum-git is bounded by one). It currently compiles without
# it only because reqwest happens to enable the feature elsewhere in the graph;
# depending on another crate's feature selection is exactly what pinning
# workspace dependencies exists to prevent.
tokio = { version = "1.48.0", features = [
    "rt",
    "rt-multi-thread",
    "process",
    "macros",
    "time",
] }
tokio-util = { version = "0.7.19", default-features = false, features = ["io"] }
# `util` for `ServiceExt::oneshot` in router tests.
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
# The Android core's Kotlin bindings. Pinned exactly: the generated Kotlin and
# the scaffolding in the cdylib must come from the same UniFFI release, and a
# silent minor bump would regenerate bindings the app was not built against.
# Features are chosen per use in `crates/rostrum-ffi/Cargo.toml`: `tokio`
# everywhere, `cli` (the bindgen) only on the host, never inside the `.so`.
uniffi = "=0.32.1"
unicode-segmentation = "1.12.0"

# Zed patches these to its own forks. Building gpui outside Zed's workspace
# requires the same patches, or the dependency graph fails to resolve.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop" }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

[profile.dev.package."*"]
opt-level = 2

# The Android shared library (`librostrum_ffi.so`), built by the Gradle project
# under `android/` through cargo-ndk. A profile of its own so desktop
# `--release` builds keep their settings. `panic = "unwind"` is required:
# UniFFI catches panics at the FFI boundary and turns them into Kotlin
# exceptions, which an aborting panic would bypass. Symbols are stripped by AGP
# when it packages the APK, not here, because uniffi-bindgen's library mode
# reads the `UNIFFI_META_*` symbols out of the built `.so`.
[profile.android-release]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
debug = false
strip = "debuginfo"
