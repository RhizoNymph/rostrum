[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
# --- Local crates -----------------------------------------------------------
rostrum-core = { path = "crates/rostrum-core" }
rostrum-github = { path = "crates/rostrum-github" }
rostrum-ui = { path = "crates/rostrum-ui" }

# --- GPUI -------------------------------------------------------------------
# NOTE: these point at a local Zed checkout for fast iteration. The portable
# form is a pinned git dependency on all three from the SAME rev:
#
#   gpui          = { git = "https://github.com/zed-industries/zed", rev = "<rev>", ... }
#   gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "<rev>", ... }
#   gpui_tokio    = { git = "https://github.com/zed-industries/zed", rev = "<rev>" }
#
# Do NOT mix sources: `gpui` is on crates.io as 0.2.2, but `gpui_platform` is
# unpublished and declares `gpui` as a bare path dep with no version, so a git
# dep on it resolves gpui from the git checkout. Declaring gpui from crates.io
# alongside it compiles two incompatible copies of gpui.
gpui = { path = "/home/nymph/Code/devtools/zed/crates/gpui", default-features = false, features = [
    "wayland",
] }
gpui_platform = { path = "/home/nymph/Code/devtools/zed/crates/gpui_platform", default-features = false, features = [
    "wayland",
] }
gpui_tokio = { path = "/home/nymph/Code/devtools/zed/crates/gpui_tokio" }

# --- Third party ------------------------------------------------------------
anyhow = "1.0.100"
chrono = { version = "0.4.42", features = ["serde"] }
dirs = "6.0.0"
futures = "0.3.31"
reqwest = { version = "0.12.24", default-features = false, features = [
    "json",
    "gzip",
    "rustls-tls",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = [
    "rt",
    "rt-multi-thread",
    "process",
    "macros",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# Zed patches these to its own forks. Building gpui outside Zed's workspace
# requires the same patches, or the dependency graph fails to resolve.
[patch.crates-io]
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/smol-rs/async-task.git", rev = "b4486cd71e4e94fbda54ce6302444de14f4d190e" }
calloop = { git = "https://github.com/zed-industries/calloop" }

[profile.dev]
split-debuginfo = "unpacked"
incremental = true
codegen-units = 16
debug = "limited"

[profile.dev.package."*"]
opt-level = 2
